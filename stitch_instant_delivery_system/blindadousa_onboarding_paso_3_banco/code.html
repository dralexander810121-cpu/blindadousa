<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#f0f1ee",
                        "surface-container-high": "#e8e8e5",
                        "primary-mid": "#2D6A4F",
                        "primary": "#012d1d",
                        "error-container": "#ffdad6",
                        "gray": "#6B7280",
                        "inverse-surface": "#2f312f",
                        "primary-fixed": "#c1ecd4",
                        "inverse-primary": "#a5d0b9",
                        "tertiary-container": "#503700",
                        "tertiary-fixed": "#ffdea9",
                        "on-surface-variant": "#414844",
                        "on-error-container": "#93000a",
                        "warning": "#F77F00",
                        "primary-fixed-dim": "#a5d0b9",
                        "on-primary-fixed-variant": "#274e3d",
                        "surface-container-low": "#f3f4f1",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#d89b00",
                        "error": "#ba1a1a",
                        "outline-variant": "#c1c8c2",
                        "on-background": "#1a1c1a",
                        "surface-tint": "#3f6653",
                        "surface": "#f9faf6",
                        "on-primary-container": "#86af99",
                        "on-tertiary-fixed": "#271900",
                        "on-error": "#ffffff",
                        "accent-dark": "#E76F51",
                        "surface-dim": "#dadad7",
                        "secondary-container": "#ffab69",
                        "secondary-fixed": "#ffdcc4",
                        "primary-container": "#1b4332",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#002114",
                        "on-surface": "#1a1c1a",
                        "on-secondary-fixed": "#2f1400",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#ffba27",
                        "secondary-fixed-dim": "#ffb780",
                        "dark": "#1A1A2E",
                        "on-tertiary-fixed-variant": "#5e4100",
                        "tertiary": "#342300",
                        "on-secondary-fixed-variant": "#6f3800",
                        "on-secondary-container": "#783d01",
                        "surface-bright": "#f9faf6",
                        "background": "#f9faf6",
                        "surface-variant": "#e2e3e0",
                        "secondary": "#8e4e14",
                        "success": "#52B788",
                        "surface-container": "#eeeeeb",
                        "danger": "#D62828",
                        "surface-container-highest": "#e2e3e0",
                        "primary-light": "#40916C",
                        "surface-container-lowest": "#ffffff",
                        "pale-green": "#D8F3DC",
                        "outline": "#717973"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target": "48px",
                        "gutter": "1rem",
                        "stack-lg": "3rem",
                        "margin-desktop": "2.5rem",
                        "stack-sm": "0.5rem",
                        "stack-md": "1.5rem",
                        "margin-mobile": "1.25rem"
                    },
                    "fontFamily": {
                        "data-mono": ["JetBrains Mono"],
                        "display-lg-mobile": ["Bebas Neue"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Bebas Neue"]
                    },
                    "fontSize": {
                        "data-mono": ["20px", {"lineHeight": "1.0", "fontWeight": "500"}],
                        "display-lg-mobile": ["40px", {"lineHeight": "1.1", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "500"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-sm": ["14px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                        "display-lg": ["64px", {"lineHeight": "1.1", "letterSpacing": "0.02em", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .option-card:hover .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
        .progress-glow {
            box-shadow: 0 0 15px rgba(82, 183, 136, 0.4);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-between items-center h-16 px-margin-mobile md:px-margin-desktop w-full z-50 bg-surface dark:bg-on-background border-b border-outline-variant dark:border-outline sticky top-0">
<div class="text-headline-md font-display-lg text-primary-mid dark:text-success uppercase tracking-wider">
            BlindadoUSA
        </div>
<button class="material-symbols-outlined text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low transition-colors p-2 rounded-full">
            help_outline
        </button>
</header>
<main class="flex-grow flex flex-col items-center justify-start px-margin-mobile py-stack-md md:py-stack-lg max-w-4xl mx-auto w-full">
<!-- Progress Indicator -->
<div class="w-full mb-stack-lg">
<div class="flex justify-between items-end mb-2">
<span class="text-label-sm font-label-sm text-primary uppercase tracking-widest">Paso 3 de 5</span>
<span class="text-data-mono font-data-mono text-primary-mid">60%</span>
</div>
<div class="w-full h-3 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-success transition-all duration-700 ease-out progress-glow" style="width: 60%"></div>
</div>
</div>
<!-- Hero Text -->
<div class="text-center mb-stack-lg">
<h1 class="text-headline-md-mobile font-headline-md text-primary mb-2">Queremos ayudarte mejor, Juan</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">¿Tienes cuenta de banco en USA?</p>
</div>
<!-- Question Modules (High-Contrast Selection) -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full mb-stack-lg">
<button class="option-card group flex flex-col items-center justify-center p-8 bg-surface-container-low border-2 border-transparent rounded-xl hover:border-primary-mid transition-all duration-200 min-h-[160px] text-center shadow-sm" onclick="selectOption(this)">
<div class="w-12 h-12 rounded-full bg-pale-green flex items-center justify-center mb-4 text-primary-mid group-hover:bg-primary-mid group-hover:text-white transition-colors">
<span class="material-symbols-outlined text-[32px]">check_circle</span>
</div>
<span class="text-body-lg font-bold text-primary">Sí</span>
</button>
<button class="option-card group flex flex-col items-center justify-center p-8 bg-surface-container-low border-2 border-transparent rounded-xl hover:border-primary-mid transition-all duration-200 min-h-[160px] text-center shadow-sm" onclick="selectOption(this)">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center mb-4 text-outline group-hover:bg-primary-mid group-hover:text-white transition-colors">
<span class="material-symbols-outlined text-[32px]">cancel</span>
</div>
<span class="text-body-lg font-bold text-primary">No</span>
</button>
<button class="option-card group flex flex-col items-center justify-center p-8 bg-surface-container-low border-2 border-transparent rounded-xl hover:border-primary-mid transition-all duration-200 min-h-[160px] text-center shadow-sm" onclick="selectOption(this)">
<div class="w-12 h-12 rounded-full bg-secondary-fixed flex items-center justify-center mb-4 text-secondary group-hover:bg-primary-mid group-hover:text-white transition-colors">
<span class="material-symbols-outlined text-[32px]">pending</span>
</div>
<span class="text-body-lg font-bold text-primary">Estoy abriendo una</span>
</button>
</div>
<!-- Helper Context Card -->
<div class="w-full bg-surface-container-lowest p-6 rounded-xl border border-outline-variant flex gap-4 items-start mb-stack-lg shadow-sm">
<div class="text-secondary">
<span class="material-symbols-outlined">info</span>
</div>
<div>
<p class="text-body-md font-body-md text-on-surface-variant leading-relaxed">
                    Saber esto nos permite identificar si calificas para ciertos beneficios federales y programas de ahorro exclusivos para residentes con actividad bancaria activa.
                </p>
</div>
</div>
<!-- Primary Actions -->
<div class="w-full flex flex-col gap-4 mt-auto">
<button class="w-full h-touch-target bg-secondary-container text-on-secondary-container font-bold text-body-lg rounded-xl shadow-lg shadow-secondary-container/20 hover:scale-[1.02] active:scale-[0.98] transition-transform">
                Siguiente
            </button>
<button class="w-full h-touch-target border-2 border-primary-mid text-primary-mid font-bold text-body-lg rounded-xl hover:bg-pale-green transition-colors">
                Regresar
            </button>
</div>
</main>
<!-- Floating AI Assistant (Manual override context) -->
<div class="fixed bottom-6 right-6 z-50">
<button class="w-14 h-14 bg-gradient-to-br from-primary-mid to-primary text-white rounded-full flex items-center justify-center shadow-xl hover:scale-110 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
</button>
</div>
<!-- Simple Script for interactions -->
<script>
        function selectOption(element) {
            // Reset all
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('border-primary-mid', 'bg-pale-green');
                card.classList.add('bg-surface-container-low', 'border-transparent');
            });
            // Select current
            element.classList.remove('bg-surface-container-low', 'border-transparent');
            element.classList.add('border-primary-mid', 'bg-pale-green');
            
            // Interaction feedback
            element.classList.add('scale-95');
            setTimeout(() => element.classList.remove('scale-95'), 150);
        }
    </script>
</body></html>
