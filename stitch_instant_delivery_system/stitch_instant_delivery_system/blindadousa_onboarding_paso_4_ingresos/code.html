<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .sombra-verde {
            box-shadow: 0 10px 15px -3px rgba(27, 67, 50, 0.15), 0 4px 6px -4px rgba(27, 67, 50, 0.1);
        }
        .option-card:hover .radio-circle {
            border-color: #2D6A4F;
        }
        input[type="radio"]:checked + .option-content {
            background-color: #D8F3DC;
            border-color: #2D6A4F;
        }
        input[type="radio"]:checked + .option-content .radio-circle {
            background-color: #2D6A4F;
            border-color: #2D6A4F;
        }
        input[type="radio"]:checked + .option-content .radio-inner {
            display: block;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "inverse-on-surface": "#f0f1ee",
                      "surface-container-high": "#e8e8e5",
                      "primary-mid": "#2D6A4F",
                      "primary": "#012d1d",
                      "error-container": "#ffdad6",
                      "gray": "#6B7280",
                      "inverse-surface": "#2f312f",
                      "primary-fixed": "#c1ecd4",
                      "inverse-primary": "#a5d0b9",
                      "tertiary-container": "#503700",
                      "tertiary-fixed": "#ffdea9",
                      "on-surface-variant": "#414844",
                      "on-error-container": "#93000a",
                      "warning": "#F77F00",
                      "primary-fixed-dim": "#a5d0b9",
                      "on-primary-fixed-variant": "#274e3d",
                      "surface-container-low": "#f3f4f1",
                      "on-primary": "#ffffff",
                      "on-tertiary-container": "#d89b00",
                      "error": "#ba1a1a",
                      "outline-variant": "#c1c8c2",
                      "on-background": "#1a1c1a",
                      "surface-tint": "#3f6653",
                      "surface": "#f9faf6",
                      "on-primary-container": "#86af99",
                      "on-tertiary-fixed": "#271900",
                      "on-error": "#ffffff",
                      "accent-dark": "#E76F51",
                      "surface-dim": "#dadad7",
                      "secondary-container": "#ffab69",
                      "secondary-fixed": "#ffdcc4",
                      "primary-container": "#1b4332",
                      "on-secondary": "#ffffff",
                      "on-primary-fixed": "#002114",
                      "on-surface": "#1a1c1a",
                      "on-secondary-fixed": "#2f1400",
                      "on-tertiary": "#ffffff",
                      "tertiary-fixed-dim": "#ffba27",
                      "secondary-fixed-dim": "#ffb780",
                      "dark": "#1A1A2E",
                      "on-tertiary-fixed-variant": "#5e4100",
                      "tertiary": "#342300",
                      "on-secondary-fixed-variant": "#6f3800",
                      "on-secondary-container": "#783d01",
                      "surface-bright": "#f9faf6",
                      "background": "#f9faf6",
                      "surface-variant": "#e2e3e0",
                      "secondary": "#8e4e14",
                      "success": "#52B788",
                      "surface-container": "#eeeeeb",
                      "danger": "#D62828",
                      "surface-container-highest": "#e2e3e0",
                      "primary-light": "#40916C",
                      "pale-green": "#D8F3DC",
                      "outline": "#717973"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "touch-target": "48px",
                      "gutter": "1rem",
                      "stack-lg": "3rem",
                      "margin-desktop": "2.5rem",
                      "stack-sm": "0.5rem",
                      "stack-md": "1.5rem",
                      "margin-mobile": "1.25rem"
              },
              "fontFamily": {
                      "data-mono": ["JetBrains Mono"],
                      "display-lg-mobile": ["Bebas Neue"],
                      "body-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "label-sm": ["Inter"],
                      "headline-md": ["Inter"],
                      "display-lg": ["Bebas Neue"]
              },
              "fontSize": {
                      "data-mono": ["20px", {"lineHeight": "1.0", "fontWeight": "500"}],
                      "display-lg-mobile": ["40px", {"lineHeight": "1.1", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "500"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "label-sm": ["14px", {"lineHeight": "1.2", "fontWeight": "600"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                      "display-lg": ["64px", {"lineHeight": "1.1", "letterSpacing": "0.02em", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md selection:bg-pale-green selection:text-primary">
<!-- Top Navigation Header (Suppressed as per Relevance Check, but TopAppBar for brand consistency) -->
<header class="bg-surface dark:bg-on-background border-b border-outline-variant dark:border-outline flex justify-between items-center h-16 px-margin-mobile md:px-margin-desktop w-full z-50">
<div class="text-headline-md font-display-lg text-primary-mid dark:text-success uppercase tracking-wider">
            BlindadoUSA
        </div>
<button class="material-symbols-outlined text-primary-mid hover:bg-surface-container-low transition-colors rounded-full p-2" data-icon="help_outline">help_outline</button>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-stack-lg max-w-2xl mx-auto w-full">
<!-- Onboarding Progress -->
<div class="w-full mb-stack-lg">
<div class="flex justify-between items-end mb-2">
<span class="text-label-sm font-label-sm text-primary-mid uppercase tracking-widest">Paso 4 de 5</span>
<span class="text-data-mono font-data-mono text-primary">80%</span>
</div>
<div class="w-full bg-surface-container-highest rounded-full h-2 overflow-hidden">
<div class="bg-primary-mid h-full rounded-full transition-all duration-700 ease-out" style="width: 80%"></div>
</div>
</div>
<!-- Header Content -->
<div class="text-center mb-stack-md w-full">
<h1 class="font-headline-md text-headline-md-mobile md:text-headline-md text-primary mb-2">
                Queremos ayudarte mejor, Juan
            </h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">
                Más o menos, ¿cuánto ganas al mes?
            </p>
</div>
<!-- Income Selection Grid (Bento Style Options) -->
<form class="w-full space-y-4" id="incomeForm">
<div class="grid grid-cols-1 gap-4">
<!-- Option 1 -->
<label class="relative block cursor-pointer group">
<input class="sr-only peer" name="income" type="radio" value="under_2000"/>
<div class="option-content flex items-center p-5 rounded-xl border-2 border-surface-variant bg-surface-container-lowest transition-all duration-200 hover:border-primary-mid sombra-verde group-active:scale-[0.98]">
<div class="flex-shrink-0 w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center text-primary-mid mr-4">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
</div>
<div class="flex-grow">
<p class="text-body-lg font-body-lg text-on-surface">Menos de $2,000</p>
</div>
<div class="radio-circle w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="radio-inner hidden w-3 h-3 rounded-full bg-on-primary"></div>
</div>
</div>
</label>
<!-- Option 2 -->
<label class="relative block cursor-pointer group">
<input class="sr-only peer" name="income" type="radio" value="2000_4000"/>
<div class="option-content flex items-center p-5 rounded-xl border-2 border-surface-variant bg-surface-container-lowest transition-all duration-200 hover:border-primary-mid sombra-verde group-active:scale-[0.98]">
<div class="flex-shrink-0 w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center text-primary-mid mr-4">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<div class="flex-grow">
<p class="text-body-lg font-body-lg text-on-surface">$2,000 - $4,000</p>
</div>
<div class="radio-circle w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="radio-inner hidden w-3 h-3 rounded-full bg-on-primary"></div>
</div>
</div>
</label>
<!-- Option 3 -->
<label class="relative block cursor-pointer group">
<input class="sr-only peer" name="income" type="radio" value="4000_7000"/>
<div class="option-content flex items-center p-5 rounded-xl border-2 border-surface-variant bg-surface-container-lowest transition-all duration-200 hover:border-primary-mid sombra-verde group-active:scale-[0.98]">
<div class="flex-shrink-0 w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center text-primary-mid mr-4">
<span class="material-symbols-outlined" data-icon="savings">savings</span>
</div>
<div class="flex-grow">
<p class="text-body-lg font-body-lg text-on-surface">$4,000 - $7,000</p>
</div>
<div class="radio-circle w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="radio-inner hidden w-3 h-3 rounded-full bg-on-primary"></div>
</div>
</div>
</label>
<!-- Option 4 -->
<label class="relative block cursor-pointer group">
<input class="sr-only peer" name="income" type="radio" value="over_7000"/>
<div class="option-content flex items-center p-5 rounded-xl border-2 border-surface-variant bg-surface-container-lowest transition-all duration-200 hover:border-primary-mid sombra-verde group-active:scale-[0.98]">
<div class="flex-shrink-0 w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center text-primary-mid mr-4">
<span class="material-symbols-outlined" data-icon="trending_up">trending_up</span>
</div>
<div class="flex-grow">
<p class="text-body-lg font-body-lg text-on-surface">Más de $7,000</p>
</div>
<div class="radio-circle w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="radio-inner hidden w-3 h-3 rounded-full bg-on-primary"></div>
</div>
</div>
</label>
</div>
<!-- Action Area -->
<div class="pt-stack-md">
<button class="w-full h-touch-target bg-secondary-container hover:bg-secondary-container/90 text-on-secondary-container font-bold text-body-lg rounded-xl transition-all duration-150 active:scale-95 shadow-lg shadow-secondary-container/20 flex items-center justify-center gap-2" type="submit">
                    Siguiente
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="text-center mt-4 text-label-sm font-label-sm text-outline">
                    Tus datos están protegidos con cifrado de grado militar.
                </p>
</div>
</form>
</main>
<!-- Floating AI Assistant - Mandatory Component -->
<div class="fixed bottom-6 right-6 z-50">
<button class="w-14 h-14 rounded-full bg-primary-mid text-on-primary flex items-center justify-center shadow-2xl hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined text-3xl" data-icon="smart_toy" data-weight="fill">smart_toy</span>
</button>
</div>
<!-- Background Decorative Elements -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 opacity-30">
<div class="absolute top-[10%] right-[5%] w-64 h-64 bg-pale-green rounded-full blur-[100px]"></div>
<div class="absolute bottom-[20%] left-[5%] w-96 h-96 bg-primary-mid/10 rounded-full blur-[120px]"></div>
</div>
<script>
        // Micro-interaction for form submission
        document.getElementById('incomeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const selected = document.querySelector('input[name="income"]:checked');
            if (selected) {
                const btn = e.target.querySelector('button[type="submit"]');
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Procesando...';
                setTimeout(() => {
                    alert('Navegando al paso 5: Análisis final de crédito.');
                }, 800);
            } else {
                alert('Por favor selecciona una opción para continuar.');
            }
        });
    </script>
</body></html>
